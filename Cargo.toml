[package]
name = "desktop-app"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core GUI framework
egui = "0.28"
eframe = { version = "0.28", default-features = true, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
] }
egui_extras = "0.28"

# Serialization for settings and data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Serial communication
serialport = "4.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Async runtime (for future use with network operations)
tokio = { version = "1.0", features = ["full"], optional = true }

# Error handling
thiserror = "1.0"

# Random number generation for simulation
rand = "0.8"

# Database
diesel = { version = "2.1", features = ["sqlite", "chrono", "r2d2"] }
diesel_migrations = "2.1"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Environment variables
dotenv = "0.15"

# PDF generation
printpdf = { version = "0.7", features = ["embedded_images"] }

[dev-dependencies]
# Development tools (install with: cargo install cargo-watch cargo-audit)
# cargo-watch = "8.0"  # Commented as this is a binary, not a library dependency
# cargo-audit = "0.18" # Commented as this is a binary, not a library dependency
